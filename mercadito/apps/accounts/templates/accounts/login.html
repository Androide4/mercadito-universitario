{% extends 'base.html' %}
{% block content %}

<h1>Login</h1>

<form method="POST">

    {% csrf_token %}

    <input type="email" name="correo" placeholder="Correo">

    <input type="password" name="password" placeholder="Contraseña">

    <button type="submit">
        Ingresar
    </button>

</form>

{% if error %}
    <p>{{ error }}</p>
{% endif %}
{% endblock %}
