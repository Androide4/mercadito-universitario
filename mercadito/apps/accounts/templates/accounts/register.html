{% extends "base.html" %}

{% block titulo %}Registro - Mercadito{% endblock %}

{% block contenido %}

<div class="login-container">

    <div class="login-card">

        <h1>Registro</h1>

        <form method="POST" enctype="multipart/form-data" class="login-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Registrarse
            </button>

        </form>

    </div>

</div>

{% endblock %}
