<!-- Reemplaza esta línea: -->
{% include "interacciones/partials/_favorito_btn.html" with pub_id=pub.id pub_titulo=pub.titulo pub_categoria=pub.categoria next=request.path %}

<!-- Por esto: -->
<form method="post" action="{% url 'interacciones:guardar_favorito' %}" style="display: inline-block; margin-bottom: 8px;">
    {% csrf_token %}
    <input type="hidden" name="pub_id" value="{{ pub.id }}">
    <input type="hidden" name="pub_titulo" value="{{ pub.titulo }}">
    <input type="hidden" name="pub_categoria" value="{{ pub.categoria }}">
    <input type="hidden" name="next" value="{{ request.path }}">
    <button type="submit" class="btn btn--favorito btn-sm">
        ⭐ Favorito
    </button>
</form>
