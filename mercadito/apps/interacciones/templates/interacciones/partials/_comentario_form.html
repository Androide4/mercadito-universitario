<div class="seccion-comentar">
    <h3>💬 Deja un comentario</h3>

    <form method="post" action="{% url 'interacciones:comentar_publicacion' %}">
        {% csrf_token %}

        <input type="hidden" name="pub_id" value="{{ pub_id|default:'' }}">
        <input type="hidden" name="pub_titulo" value="{{ pub_titulo }}">
        {% if pub_categoria %}
            <input type="hidden" name="pub_categoria" value="{{ pub_categoria }}">
        {% endif %}
        <input type="hidden" name="next" value="{{ next_url|default:request.path }}">

        {{ form.texto|safe }}

        <div class="form-char-count" id="char-count">0 / 300</div>

        <button type="submit" class="btn btn--primario" style="margin-top: 1rem;">
            ✉️ Publicar comentario
        </button>
    </form>
</div>

<script>
    const textarea = document.querySelector('textarea[name="texto"]');
    const count = document.getElementById('char-count');
    if (textarea) {
        function updateCount() {
            count.textContent = `${textarea.value.length} / 300`;
        }
        textarea.addEventListener('input', updateCount);
        updateCount();
    }
</script>
