<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mercadito Universitario{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'publicaciones/style.css' %}">
</head>
<body>

    <header class="navbar">
        <div class="navbar-brand">
            🎓 Mercadito Universitario
        </div>
        <nav class="navbar-links">
            <a href="{% url 'listar_publicaciones' %}">Ver publicaciones</a>
            <a href="{% url 'crear_publicacion' %}" class="btn-nav">+ Publicar artículo</a>
        </nav>
    </header>

    <main class="container">

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block contenido %}{% endblock %}

    </main>

    <footer class="footer">
        <p>Mercadito Universitario de Intercambio &copy; 2026</p>
    </footer>

</body>
</html>
