{% extends "base.html" %}

{% block titulo %}Enviar Solicitud - Mercadito{% endblock %}

{% block contenido %}

<div class="solicitud-form-container">

    <div class="solicitud-form-header">

        <h1>Enviar Solicitud</h1>

        <a href="{% url 'lista_solicitudes' %}" class="btn-link">
            Ver Solicitudes
        </a>

    </div>

    <div class="solicitud-form-card">

        <form method="POST" class="solicitud-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Enviar Solicitud
            </button>

        </form>

    </div>

</div>

{% endblock %}
